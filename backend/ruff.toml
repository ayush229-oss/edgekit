[lint]
select = ["E", "F", "W"]
ignore = [
  "E501",   # line too long — handled by formatter
  "E401",   # multiple imports on one line
  "E402",   # module level import not at top of file
  "E701",   # multiple statements on one line (colon)
  "E702",   # multiple statements on one line (semicolon)
  "E731",   # do not assign a lambda expression
  "E741",   # ambiguous variable name
  "F401",   # imported but unused
  "F541",   # f-string without placeholders
  "F811",   # redefinition of unused name
  "F841",   # local variable assigned but never used
]

# F821 (undefined name) is deliberately NOT ignored. It is the one lint here
# that catches guaranteed runtime crashes rather than style: it was suppressed
# while node_chat called _validate_node_def, a function nested inside a
# different route, and every such call raised NameError in production.
